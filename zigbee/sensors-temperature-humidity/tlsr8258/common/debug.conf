# RTT console. Add with -DEXTRA_CONF_FILE=<this file>; combine with awake.conf to
# keep the device from sleeping while a debugger is attached.
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SEGGER_RTT_MAX_NUM_UP_BUFFERS=1
CONFIG_SEGGER_RTT_MAX_NUM_DOWN_BUFFERS=1
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=16
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
