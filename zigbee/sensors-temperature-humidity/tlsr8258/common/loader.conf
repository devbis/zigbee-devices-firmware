# Loader (MCUboot) configuration of the sensors, on top of the board's default.
# The default has serial recovery on UART0 (PB1/PA0); no sensor board wires those
# out for it, and some use the pins for the LED, the button or the bus, so it is off.
CONFIG_MCUBOOT_SERIAL=n
CONFIG_BOOT_TC32_SERIAL_BREAK_ENTRANCE=n
CONFIG_BOOT_SERIAL_NO_APPLICATION=n
CONFIG_UART_TLSR8258_IRQ_DMA_RX=n
CONFIG_SERIAL=n
