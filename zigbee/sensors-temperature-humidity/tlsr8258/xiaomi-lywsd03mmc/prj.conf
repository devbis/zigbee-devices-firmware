# Differences from sensors/common/sensor.conf for this device.

# The panel of the board revision B1.6 is on UART0 (transmit only): no console;
# use debug.conf for RTT
CONFIG_SERIAL=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Thermostat User Interface Configuration: the panel's settings
CONFIG_ZIGBEE_ZCL_THERMOSTAT_UI_CFG=y

# The panel shows the last measurement until the next wake: wake twice a minute
CONFIG_ZIGBEE_ED_POLL_INTERVAL_MS=30000

# Manufacturer code: node descriptor and OTA files
CONFIG_ZIGBEE_MANUFACTURER_CODE=0xDB15
