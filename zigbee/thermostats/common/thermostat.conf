# What a floor-heating thermostat has on top of zigbee/common/router.conf
CONFIG_ZIGBEE_ZCL_LEVEL_CTRL=y
CONFIG_ZIGBEE_ZCL_TIME=y
CONFIG_ZIGBEE_ZCL_THERMOSTAT=y
CONFIG_ZIGBEE_ZCL_THERMOSTAT_UI_CFG=y
CONFIG_ZIGBEE_ZCL_FAN_CONTROL=y
CONFIG_ZIGBEE_ZCL_RELATIVE_HUMIDITY=y
# local temperature, set point, system mode, running state, programming mode
CONFIG_ZIGBEE_ZCL_REPORTING_TABLE_SIZE=8

# The thermostat MCU over UART
CONFIG_SERIAL=y
CONFIG_IOTDRV_TUYA_MCU=y
CONFIG_IOTDRV_TUYA_UART=y
CONFIG_IOTDRV_TUYA_THERMOSTAT=y
