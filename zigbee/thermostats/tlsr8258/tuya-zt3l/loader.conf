# Loader (MCUboot) configuration of this device, on top of the board's default.
# The default has serial recovery on UART0; here UART0 talks to the thermostat
# MCU (PB1/PB7), so it is off.
CONFIG_MCUBOOT_SERIAL=n
CONFIG_BOOT_TC32_SERIAL_BREAK_ENTRANCE=n
CONFIG_BOOT_SERIAL_NO_APPLICATION=n
CONFIG_UART_TLSR8258_IRQ_DMA_RX=n
CONFIG_SERIAL=n
