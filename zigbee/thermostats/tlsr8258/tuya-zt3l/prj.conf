# Differences from thermostats/common/thermostat.conf for this device.

# The only UART is the one to the MCU, so there is no console; use debug.conf for RTT
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Manufacturer code: node descriptor and OTA files (Telink's, as the stock module has)
CONFIG_ZIGBEE_MANUFACTURER_CODE=0x1141
