# What a plug has on top of zigbee/common/router.conf: On/Off, Electrical
# Measurement and Metering
CONFIG_ZIGBEE_ZCL_ON_OFF=y
CONFIG_ZIGBEE_ZCL_ELECTRICAL_MEASUREMENT=y
CONFIG_ZIGBEE_ZCL_METERING=y
# voltage, current, power, energy, on/off
CONFIG_ZIGBEE_ZCL_REPORTING_TABLE_SIZE=8

CONFIG_SENSOR=y
