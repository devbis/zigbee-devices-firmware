# What a temperature and humidity sensor has on top of zigbee/common/base.conf and
# end_device.conf: Power Configuration, Temperature Measurement, Relative Humidity
CONFIG_ZIGBEE_ZCL_POWER_CFG=y
CONFIG_ZIGBEE_ZCL_TEMPERATURE_MEASUREMENT=y
CONFIG_ZIGBEE_ZCL_RELATIVE_HUMIDITY=y
# temperature, humidity, battery voltage and percentage, with room for the coordinator's own
CONFIG_ZIGBEE_ZCL_REPORTING_TABLE_SIZE=6

CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_ADC=y

# One measurement and one report per wake (and a wake per parent poll), see sensor.c.
# A boot is what a wake costs, so the interval is long; commands and OTA reach the
# device in the fast poll window that follows every report.
CONFIG_ZIGBEE_ED_POLL_INTERVAL_MS=60000
