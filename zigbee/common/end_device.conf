# A battery powered Zigbee end device: on top of base.conf. It deep sleeps between
# parent polls; every wake is a reset, so the firmware starts afresh and restores
# the network from NV (see CONFIG_ZIGBEE_SLEEPY_DEEP in the Zephyr fork).
CONFIG_ZIGBEE_ED=y
CONFIG_PM=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_ZIGBEE_SLEEPY=y
CONFIG_ZIGBEE_SLEEPY_DEEP=y
