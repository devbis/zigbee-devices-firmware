# SPDX-License-Identifier: Apache-2.0

# A Zigbee router built for MCUboot, with OTA: what every device here has
CONFIG_ZIGBEE=y
CONFIG_ZIGBEE_ROUTER=y
CONFIG_ZIGBEE_BDB=y
CONFIG_ZIGBEE_ZCL=y
CONFIG_ZIGBEE_GP=n
CONFIG_ZIGBEE_OTA=y
CONFIG_ZIGBEE_WWAH=n
CONFIG_ZIGBEE_ZCL_GROUP=y

CONFIG_GPIO=y
CONFIG_REBOOT=y

CONFIG_NETWORKING=y
CONFIG_NET_L2_CUSTOM_IEEE802154=y
CONFIG_NET_TC_RX_COUNT=0
CONFIG_NET_IPV4=n
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=n
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=n
CONFIG_IEEE802154=y
CONFIG_IEEE802154_L2_PKT_INCL_FCS=n

CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

CONFIG_MAIN_STACK_SIZE=896
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_NET_BUF_RX_COUNT=2
CONFIG_NET_BUF_TX_COUNT=2
CONFIG_ZIGBEE_STACK_SIZE=2048
CONFIG_TIMESLICING=n
CONFIG_TICKLESS_KERNEL=n

CONFIG_LOG=n
