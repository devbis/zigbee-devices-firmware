name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The compiler is the TC32 LLVM released at modern-tc32/llvm-project. The release
# tag changes with updates: set the repository variable TC32_LLVM_TAG to pin another
# one (default: TC32_LLVM_TAG_DEFAULT below).
env:
  TC32_LLVM_REPO: modern-tc32/llvm-project
  TC32_LLVM_TAG_DEFAULT: 23.1.3-tc32-20261008
  TC32_LLVM_ASSET: tc32-llvm-toolchain-linux-amd64.tar.gz

jobs:
  devices:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        # a device is a directory zigbee/<kind>/<chip>/<device> with a version.txt
        run: |
          list=$(for v in zigbee/*/*/*/version.txt; do
                   d=$(dirname "$v")
                   printf '{"dir":"%s","chip":"%s","name":"%s","version":"%s"}\n' \
                     "$d" "$(basename "$(dirname "$d")")" "$(basename "$d")" "$(head -n1 "$v")"
                 done | paste -sd, -)
          echo "matrix={\"include\":[$list]}" >> "$GITHUB_OUTPUT"

  build:
    needs: devices
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.devices.outputs.matrix) }}
    env:
      # chip-project-version-additional info: the full image has the MCUboot loader
      # prepended, the OTA file carries the image for MCUboot's slot only
      ARTIFACT: ${{ matrix.chip }}-${{ matrix.name }}-${{ matrix.version }}-prepend-mcuboot
      ARTIFACT_OTA: ${{ matrix.chip }}-${{ matrix.name }}-${{ matrix.version }}-for-mcuboot
    steps:
      - uses: actions/checkout@v7
        with:
          path: ws/zigbee-devices-firmware

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build device-tree-compiler

      - name: TC32 LLVM release
        id: llvm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ vars.TC32_LLVM_TAG || env.TC32_LLVM_TAG_DEFAULT }}"
          digest=$(gh release view "$tag" -R "$TC32_LLVM_REPO" \
                   --json assets --jq ".assets[] | select(.name==\"$TC32_LLVM_ASSET\") | .digest")
          [ -n "$digest" ] || { echo "::error::no $TC32_LLVM_ASSET in $TC32_LLVM_REPO $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "digest=${digest#sha256:}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: llvm-cache
        with:
          path: ${{ runner.temp }}/llvm
          key: tc32-llvm-${{ steps.llvm.outputs.digest }}
      - name: Fetch the LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.llvm.outputs.tag }}" -R "$TC32_LLVM_REPO" -p "$TC32_LLVM_ASSET" -O llvm.tar.gz
          echo "${{ steps.llvm.outputs.digest }}  llvm.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/llvm"
          # the archive has bin/, lib/ ... at its top
          tar -xzf llvm.tar.gz -C "$RUNNER_TEMP/llvm"
          rm llvm.tar.gz
      - name: West workspace
        working-directory: ws
        run: |
          pip install west
          west init -l zigbee-devices-firmware
          # only what a TC32 build uses: the other modules are SoC HALs and libraries
          west config manifest.project-filter -- \
            -.*,+zephyr,+mcuboot,+zcbor,+mbedtls,+segger,+cmsis,+cmsis_6,+zephyr-iot-drivers
          west update --narrow -o=--depth=1
          pip install -r zephyr/scripts/requirements-base.txt \
                      -r bootloader/mcuboot/scripts/requirements.txt

      - name: Build
        working-directory: ws/zigbee-devices-firmware
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/ws/zephyr
          ZEPHYR_EXTRA_MODULES: ${{ github.workspace }}/ws/modules/lib/zephyr-iot-drivers
          LLVM_TOOLCHAIN_PATH: ${{ runner.temp }}/llvm
        run: scripts/build.sh "${{ matrix.dir }}"

      - name: Name the image
        run: |
          b=ws/zigbee-devices-firmware/build/${{ matrix.name }}
          mkdir -p dist
          cp "$b/${{ matrix.name }}-${{ matrix.version }}-full.bin" "dist/$ARTIFACT.bin"
          cp "$b/${{ matrix.name }}-${{ matrix.version }}.zigbee" "dist/$ARTIFACT_OTA.zigbee"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/${{ env.ARTIFACT }}.bin
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_OTA }}
          path: dist/${{ env.ARTIFACT_OTA }}.zigbee
          if-no-files-found: error
